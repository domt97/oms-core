name: Delete merged branches

# Same behaviour as the other OMS repos: once a PR is merged,
# delete its head branch (except protected ones). Local copies are cleaned by
# oms-workspace scripts/sync-repos.sh. Any merged branch goes (feat/, fix/, ci/, docs/...). Release tags are not
# branches and are never touched.
on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const head = pr.head.ref;

            // Only branches of this repository (never a fork's branch)
            if (pr.head.repo.full_name !== pr.base.repo.full_name) {
              console.log(`Skip branch from another repository: ${pr.head.repo.full_name}`);
              return;
            }

            // Protected branches that must never be deleted
            const protectedBranches = ["main", "master", "develop"];
            if (protectedBranches.includes(head) || head.startsWith("release/")) {
              console.log(`Skip protected branch: ${head}`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${head}`
              });
              console.log(`Deleted ${head}`);
            } catch (e) {
              // 422 = already deleted (e.g. by GitHub's auto-delete setting)
              if (e.status === 422) {
                console.log(`Branch ${head} already deleted`);
              } else {
                throw e;
              }
            }
