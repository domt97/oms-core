name: Pre-release

# Pre-releases only (ADR 0005): the repository owner tags an oms-core branch vX.Y.Z-rc.N to test a service PR against an
# unmerged oms-core change. Final releases are published from master by publish.yml, never from a tag.
# Published versions are immutable: never re-use a number.

on:
  push:
    tags: ['v*-rc.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish oms-core pre-release
    # Only the repository owner creates pre-releases (CLAUDE.md): an rc from anyone else is not published.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z-rc.N"; exit 1
          fi
          base="${TAG%-rc.*}"
          if git rev-parse -q --verify "refs/tags/${base}" >/dev/null; then
            echo "::error::${base} is already released; an rc must be for a version that is not released yet"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test -Pversion="${{ steps.tag.outputs.version }}" --no-daemon --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -Pversion="${{ steps.tag.outputs.version }}" --no-daemon --stacktrace

      - name: Summary
        run: echo "Published pre-release com.dotran.oms:oms-core:${{ steps.tag.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
