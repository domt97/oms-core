name: Release

# Publishes com.dotran.oms:oms-core:<version> to GitHub Packages when a tag v<version> is pushed (ADR 0005).
#   vX.Y.Z       release; the tagged commit must be on master
#   vX.Y.Z-rc.N  pre-release from any branch, only to test a service PR against an unmerged oms-core change
# Published versions are immutable: never re-use a number, tag the next patch or rc instead.
# Only the repository owner creates these tags.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish oms-core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history: origin/master is needed for the ancestry check
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1
          fi
          version="${TAG#v}"
          if [[ "$version" != *-rc.* ]] && ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Release tag '$TAG' is not on master (rc tags may be on any branch)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test -Pversion="${{ steps.tag.outputs.version }}" --no-daemon --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -Pversion="${{ steps.tag.outputs.version }}" --no-daemon --stacktrace

      - name: Summary
        run: echo "Published com.dotran.oms:oms-core:${{ steps.tag.outputs.version }} to GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
