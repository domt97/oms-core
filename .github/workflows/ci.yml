name: CI

# oms-core's unit tests, plus the publication files (POM, Gradle module metadata) generated as a dry run, so a broken
# publish configuration fails on the PR instead of at release time. Services consume a published version
# (release.yml, ADR 0005): they pick up an oms-core change only when they bump coreVersion.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: oms-core unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test --no-daemon --stacktrace

      - name: Generate publication files (dry run)
        run: ./gradlew generatePomFileForMavenJavaPublication generateMetadataFileForMavenJavaPublication sourcesJar --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: oms-core-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
