plugins {
	id 'java-library'
	id 'maven-publish'
	id 'io.spring.dependency-management' version '1.1.4'
}

// group and version come from gradle.properties; a release passes -Pversion=<tag without v> (release.yml).

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.3"
	}
}

dependencies {

	api 'org.apache.commons:commons-lang3:3.18.0'

	// JSON for the correlation header (MdcPropagation); version from the Boot BOM
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Spring
	compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
	implementation 'org.springframework:spring-web'
	implementation 'org.springframework:spring-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// AWS
	implementation platform("software.amazon.awssdk:bom:2.31.76")
	implementation 'software.amazon.awssdk:s3'

	// Apache
	api 'org.apache.poi:poi-ooxml:5.4.1'

	// Swagger
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0") {
		exclude group: "org.apache.commons", module: "commons-lang3"
	}

	implementation 'jakarta.servlet:jakarta.servlet-api'
	compileOnly 'jakarta.annotation:jakarta.annotation-api'

	// Tests
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

// Published to GitHub Packages by .github/workflows/release.yml when a tag v<version> is pushed (ADR 0005).
// versionMapping writes the resolved versions into the POM and the Gradle module metadata, so consumers never depend
// on having the same BOM as oms-core to get a version for spring-web, jackson-databind, ...
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			versionMapping {
				usage('java-api') {
					fromResolutionOf('runtimeClasspath')
				}
				usage('java-runtime') {
					fromResolutionResult()
				}
			}
		}
	}
	repositories {
		maven {
			name = 'GitHubPackages'
			url = uri('https://maven.pkg.github.com/domt97/oms-core')
			credentials {
				username = System.getenv('GITHUB_ACTOR')
				password = System.getenv('GITHUB_TOKEN')
			}
		}
	}
}

// Releases only: from release.yml, with a release version. Published versions are immutable, so a publish from a
// laptop or of a SNAPSHOT would be a mistake that cannot be undone.
def releaseVersion = project.version.toString()
def releaseAllowed = System.getenv('GITHUB_ACTIONS') == 'true' && releaseVersion ==~ /\d+\.\d+\.\d+(-rc\.\d+)?/
tasks.withType(PublishToMavenRepository).configureEach {
	doFirst {
		if (!releaseAllowed) {
			throw new GradleException("oms-core is published only by release.yml with a release version (got '${releaseVersion}')")
		}
	}
}
